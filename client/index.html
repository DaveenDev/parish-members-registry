<!doctype html>
<html lang="ceb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Neutral on purpose: the app puts in the parish's name from Parish Config once it loads. -->
  <title>Parish Members Registry, Census &amp; Website</title>
  <meta name="description" content="Oras sa Misa, pahibalo ug kalihokan, mga GKK, ug rehistro sa mga pamilya sa parokya." />
  <meta name="theme-color" content="#1a2b4a" />
  <!-- Link previews (Messenger, Facebook): their robots get these filled in with the page's own
       title, text and photo and the parish's name by api/share.js (which also makes the image's
       address whole); other crawlers see them as they are. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Parish Members Registry, Census &amp; Website" />
  <meta property="og:title" content="Parish Members Registry, Census &amp; Website" />
  <meta property="og:description" content="Oras sa Misa, pahibalo ug kalihokan, mga GKK, ug rehistro sa mga pamilya sa parokya." />
  <meta property="og:image" content="/icons/icon-512.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:image:alt" content="Parish Members Registry, Census &amp; Website" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
</head>
