# Render Blueprint for the API. The database lives on Supabase and the client
# on Vercel, so this deploys the Express server only.
#
# Render > New > Blueprint > point at this repo. Then fill in the values marked
# sync: false in the dashboard — they are secrets and must not live in git.
services:
  - type: web
    name: parish-registry-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Supabase connection string (Session pooler, port 5432 — the direct
      # connection is IPv6-only and Render's free tier cannot reach it).
      - key: DATABASE_URL
        sync: false
      # node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      - key: JWT_SECRET
        sync: false
      # The Vercel origin(s) allowed to call this API, comma-separated.
      # e.g. https://parish-members-registry.vercel.app
      - key: CORS_ORIGIN
        sync: false
