# Free Supabase projects pause after 7 days without activity, which would
# take the registry, the public site and the census portal offline until
# someone restores the project by hand. This calls one tiny read-only function
# every 3 days (a weekly ping would sit right on the 7-day line).
#
# It needs no setup: the project address and the public (anon) key are the
# ones the website ships with, in client/.env.production. SUPABASE_URL and
# SUPABASE_ANON_KEY repository secrets, if set, take their place.
#
# A failed ping fails the run, so GitHub emails the repository owner. GitHub
# also turns off scheduled workflows in a repository with no commits for 60
# days, and emails before it does: re-enable it under Actions if that happens.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *' # every 3 days, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: client/.env.production
          sparse-checkout-cone-mode: false

      - name: Ping the database
        env:
          SECRET_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          from_env_file() { grep -E "^$1=" client/.env.production | head -n1 | cut -d= -f2- | tr -d '\r"'; }
          url="${SECRET_URL:-$(from_env_file VITE_SUPABASE_URL)}"
          key="${SECRET_ANON_KEY:-$(from_env_file VITE_SUPABASE_ANON_KEY)}"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::No Supabase address or public key: client/.env.production is missing them and no SUPABASE_URL / SUPABASE_ANON_KEY secrets are set."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -X POST "${url%/}/rest/v1/rpc/public_parish_stats" \
            -H "apikey: $key" \
            -H "Content-Type: application/json" \
            -d '{}' > /dev/null
          echo "Supabase answered; the project stays awake."
