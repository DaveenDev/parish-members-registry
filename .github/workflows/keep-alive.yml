# Free Supabase projects pause after 7 days without database activity, which
# would take the registry (and the census portal) offline until someone
# restores the project by hand. This calls one tiny read-only function every
# few days so that never happens.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  the anon / publishable key (the same one the website uses)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *' # every 3 days, 03:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets to keep the free Supabase project from pausing."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/public_parish_stats" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
