# Weekly off-site backup of the whole database to a private Cloudflare R2
# bucket (the free Supabase plan has no backups of its own). The dump holds
# parishioners' personal data, so it is encrypted on the runner before it
# leaves, and only ever stored encrypted. The newest BACKUP_KEEP backups stay
# in the bucket (26 weekly ones: about half a year); older ones are deleted.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL       Supabase → Connect → "Session pooler" connection
#                         string, with the database password filled in
#   BACKUP_PASSPHRASE     a long passphrase; keep a copy somewhere safe
#                         offline: without it the backups can't be opened
#   R2_ACCOUNT_ID         Cloudflare → R2 → Account ID (32 characters; the
#                         S3 API address is taken apart if pasted instead)
#   R2_ACCESS_KEY_ID      an R2 API token with Object Read & Write on the
#   R2_SECRET_ACCESS_KEY  backup bucket only
#   R2_BACKUP_BUCKET      the backup bucket's name, e.g. parish-backups
#                         (private: no public access, no r2.dev address)
#
# Until they're all set the run fails, so GitHub emails the repository owner.
#
# Restore: download a file from the bucket (Cloudflare → R2 → the bucket),
#   gpg --decrypt parish-backup-YYYY-MM-DD.tar.gz.gpg | tar -xz
# and load roles.sql, schema.sql and data.sql (in that order) into a new
# project with psql. See docs/backups.md.
name: Encrypted database backup

on:
  schedule:
    - cron: '41 2 * * 0' # Sundays, 02:41 UTC (10:41 in Manila)
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKUP_KEEP: 26

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 doesn't take the checksums newer AWS CLIs add by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Check secrets
        run: |
          missing=""
          for v in SUPABASE_DB_URL BACKUP_PASSPHRASE R2_ACCOUNT_ID R2_BACKUP_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            missing="${missing//AWS_ACCESS_KEY_ID/R2_ACCESS_KEY_ID}"
            missing="${missing//AWS_SECRET_ACCESS_KEY/R2_SECRET_ACCESS_KEY}"
            echo "::error::No backup was made. Add these repository secrets:$missing (see docs/backups.md)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # Fixes copy-paste slips in SUPABASE_DB_URL (spaces, quotes, the [ ],
      # an unencoded @ or # in the password) and says which, without
      # printing it; stops with the reason if it can't. Gives DB_URL.
      - name: Check the database connection string
        run: node .github/scripts/db-url.mjs

      # Takes the Account ID out of a pasted address, the bucket name out of a
      # pasted path, and says what's wrong otherwise. Gives R2_ENDPOINT and
      # R2_BUCKET.
      - name: Check the R2 settings
        run: node .github/scripts/r2-target.mjs

      # A wrong account ID, key or bucket, or a token that may only read,
      # shows up here in seconds, before the dump, with which secret to fix.
      - name: Check the R2 bucket
        run: |
          # Lists the bucket (list-objects-v2, not s3 ls, which fails on an
          # empty bucket), then writes a tiny file and deletes it again.
          probe=database/.write-check
          echo "written by the backup workflow's bucket check" > write-check.txt
          if out=$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" --max-keys 1 \
                     --endpoint-url "$R2_ENDPOINT" 2>&1 > /dev/null) \
             && out=$(aws s3api put-object --bucket "$R2_BUCKET" --key "$probe" --body write-check.txt \
                     --endpoint-url "$R2_ENDPOINT" 2>&1 > /dev/null); then
            rm -f write-check.txt
            aws s3api delete-object --bucket "$R2_BUCKET" --key "$probe" --endpoint-url "$R2_ENDPOINT" > /dev/null \
              || echo "::warning::Couldn't delete $probe from the bucket; it's harmless, and can be deleted by hand."
            echo "Reached the bucket, and may write to it."
            exit 0
          fi
          rm -f write-check.txt
          echo "$out"
          case "$out" in
            *[Hh]andshake*|*HANDSHAKE*|*SSL*)
              why="Cloudflare refused the connection, which means it doesn't know the account in the address. R2_ACCOUNT_ID must be the Account ID from Cloudflare → R2 Object Storage → Overview (32 digits and letters a-f)." ;;
            *"Credential access key"*|*InvalidAccessKeyId*|*SignatureDoesNotMatch*|*Unauthorized*)
              why="the token's keys are wrong. R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY are the Access Key ID and Secret Access Key shown when the R2 token was made, not the token value; make a new token if they're lost." ;;
            *NoSuchBucket*)
              why="this account has no bucket by that name. Check R2_BACKUP_BUCKET against Cloudflare → R2 Object Storage. If the bucket was made in the EU jurisdiction, put its S3 API address (ending in .eu.r2.cloudflarestorage.com) in R2_ACCOUNT_ID." ;;
            *AccessDenied*PutObject*)
              why="the token may read the bucket but not write to it. In Cloudflare → R2 Object Storage → Manage API tokens, it needs Object Read & Write (not Object Read only) on this bucket; or make a new token with that and put its two keys in R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY." ;;
            *AccessDenied*)
              why="the token may not use this bucket. In Cloudflare → R2 Object Storage → Manage API tokens, check that it's for the bucket named in R2_BACKUP_BUCKET, with Object Read & Write." ;;
            *)
              why="see the message above." ;;
          esac
          echo "::error::R2 bucket check failed: $why No backup was made (see docs/backups.md)."
          exit 1

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump roles, schema and data
        run: |
          mkdir -p backup
          supabase db dump --db-url "$DB_URL" --role-only -f backup/roles.sql
          supabase db dump --db-url "$DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$DB_URL" --data-only --use-copy -f backup/data.sql
          # An empty dump means something went wrong, not an empty parish.
          for f in roles schema data; do [ -s "backup/$f.sql" ] || { echo "::error::backup/$f.sql is empty"; exit 1; }; done
          ls -l backup

      - name: Encrypt
        run: |
          name="parish-backup-$(date -u +%F).tar.gz.gpg"
          tar -czf - -C backup . \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                  --passphrase-file <(printf '%s' "$BACKUP_PASSPHRASE") -o "$name"
          rm -rf backup
          # Make sure it opens again with the passphrase before it's stored.
          gpg --batch --pinentry-mode loopback --passphrase-file <(printf '%s' "$BACKUP_PASSPHRASE") \
              --decrypt "$name" | tar -tzf - > /dev/null
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"
          ls -l "$name"

      - name: Upload to R2
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://$R2_BUCKET/database/$BACKUP_FILE" \
            --endpoint-url "$R2_ENDPOINT" --no-progress
          echo "Stored database/$BACKUP_FILE in $R2_BUCKET."

      - name: Remove old backups
        run: |
          # Names carry the date, so sorting them by name sorts them by age.
          aws s3 ls "s3://$R2_BUCKET/database/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $4}' | grep '^parish-backup-' | sort -r | tail -n +"$((BACKUP_KEEP + 1))" \
            | while read -r old; do
                aws s3 rm "s3://$R2_BUCKET/database/$old" --endpoint-url "$R2_ENDPOINT"
              done
          echo "Backups kept:"
          aws s3 ls "s3://$R2_BUCKET/database/" --endpoint-url "$R2_ENDPOINT"
