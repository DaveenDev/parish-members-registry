# Weekly off-site backup of the whole database to a private Cloudflare R2
# bucket (the free Supabase plan has no backups of its own). The dump holds
# parishioners' personal data, so it is encrypted on the runner before it
# leaves, and only ever stored encrypted. The newest BACKUP_KEEP backups stay
# in the bucket (26 weekly ones: about half a year); older ones are deleted.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL       Supabase → Connect → "Session pooler" connection
#                         string, with the database password filled in
#   BACKUP_PASSPHRASE     a long passphrase; keep a copy somewhere safe
#                         offline: without it the backups can't be opened
#   R2_ACCOUNT_ID         Cloudflare → R2 → Account ID
#   R2_ACCESS_KEY_ID      an R2 API token with Object Read & Write on the
#   R2_SECRET_ACCESS_KEY  backup bucket only
#   R2_BACKUP_BUCKET      the backup bucket's name, e.g. parish-backups
#                         (private: no public access, no r2.dev address)
#
# Until they're all set the run fails, so GitHub emails the repository owner.
#
# Restore: download a file from the bucket (Cloudflare → R2 → the bucket),
#   gpg --decrypt parish-backup-YYYY-MM-DD.tar.gz.gpg | tar -xz
# and load roles.sql, schema.sql and data.sql (in that order) into a new
# project with psql. See docs/backups.md.
name: Encrypted database backup

on:
  schedule:
    - cron: '41 2 * * 0' # Sundays, 02:41 UTC (10:41 in Manila)
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKUP_KEEP: 26

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 doesn't take the checksums newer AWS CLIs add by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Check secrets
        run: |
          missing=""
          for v in SUPABASE_DB_URL BACKUP_PASSPHRASE R2_ACCOUNT_ID R2_BACKUP_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            missing="${missing//AWS_ACCESS_KEY_ID/R2_ACCESS_KEY_ID}"
            missing="${missing//AWS_SECRET_ACCESS_KEY/R2_SECRET_ACCESS_KEY}"
            echo "::error::No backup was made. Add these repository secrets:$missing (see docs/backups.md)."
            exit 1
          fi
          echo "R2_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump roles, schema and data
        run: |
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/roles.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f backup/data.sql
          # An empty dump means something went wrong, not an empty parish.
          for f in roles schema data; do [ -s "backup/$f.sql" ] || { echo "::error::backup/$f.sql is empty"; exit 1; }; done
          ls -l backup

      - name: Encrypt
        run: |
          name="parish-backup-$(date -u +%F).tar.gz.gpg"
          tar -czf - -C backup . \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                  --passphrase-file <(printf '%s' "$BACKUP_PASSPHRASE") -o "$name"
          rm -rf backup
          # Make sure it opens again with the passphrase before it's stored.
          gpg --batch --pinentry-mode loopback --passphrase-file <(printf '%s' "$BACKUP_PASSPHRASE") \
              --decrypt "$name" | tar -tzf - > /dev/null
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"
          ls -l "$name"

      - name: Upload to R2
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://$R2_BACKUP_BUCKET/database/$BACKUP_FILE" \
            --endpoint-url "$R2_ENDPOINT" --no-progress
          echo "Stored database/$BACKUP_FILE in $R2_BACKUP_BUCKET."

      - name: Remove old backups
        run: |
          # Names carry the date, so sorting them by name sorts them by age.
          aws s3 ls "s3://$R2_BACKUP_BUCKET/database/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $4}' | grep '^parish-backup-' | sort -r | tail -n +"$((BACKUP_KEEP + 1))" \
            | while read -r old; do
                aws s3 rm "s3://$R2_BACKUP_BUCKET/database/$old" --endpoint-url "$R2_ENDPOINT"
              done
          echo "Backups kept:"
          aws s3 ls "s3://$R2_BACKUP_BUCKET/database/" --endpoint-url "$R2_ENDPOINT"
